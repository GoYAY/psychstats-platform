   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #202a38" x="30" y="555.808721" transform="rotate(-0 30 555.808721)">增加的是完整的人，不是切出一小段</text>
