   </g>
   <g id="text_8">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #202a38" x="30" y="261.080918" transform="rotate(-0 30 261.080918)">7小时15分钟 = 7.25小时</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #202a38" x="30" y="295.834111" transform="rotate(-0 30 295.834111)">每小格1分钟，还能按秒继续细分</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #244da4" x="30" y="417.095137" transform="rotate(-0 30 417.095137)">人数：同一家庭，按完整的人计数</text>
