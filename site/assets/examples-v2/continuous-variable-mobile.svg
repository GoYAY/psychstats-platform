   <g id="text_2">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #465366" x="20" y="61.48668" transform="rotate(-0 20 61.48668)">生活例子 · 非真实调查记录</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #244da4" x="30" y="117.08748" transform="rotate(-0 30 117.08748)">时长：同一段时间可以细分</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #202a38" x="54" y="213.468867" transform="rotate(-0 54 213.468867)">7小时</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #202a38" x="138" y="213.49793" transform="rotate(-0 138 213.49793)">7小时5分钟</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #202a38" x="222" y="213.49793" transform="rotate(-0 222 213.49793)">7小时10分钟</text>
