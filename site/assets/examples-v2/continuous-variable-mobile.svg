 <desc id="desc">时长可以继续细分，孩子人数只能按整个人计数。。比较的是单个家庭的孩子人数，不是多个家庭的平均人数。平均人数可以是小数；记录保留几位小数也不能决定变量是否连续，实际时长记录仍受测量精度限制。</desc><title id="title">睡眠时长与孩子人数</title><metadata>
