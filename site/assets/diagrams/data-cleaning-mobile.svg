<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480" role="img" aria-labelledby="title desc">
  <title id="title">数据清理的核实与处理流程</title>
  <desc id="desc">保留原始数据，检查缺失、重复与异常，核实原始记录；可核实的修正并留痕，无法核实的标记并按预设规则处理，最后输出分析数据和日志。</desc>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#111827">
    <text x="14" y="24" font-size="14" font-weight="700">数据清理：先核实，再处理</text>
    <rect x="16" y="39" width="288" height="51" rx="8" fill="#f4f7fb" stroke="#aebbc9"/>
    <text x="30" y="60" font-size="13" font-weight="700">1  保留原始数据副本</text>
    <text x="30" y="78" font-size="12" fill="#485567">确保每一步都可以追溯</text>
    <path d="M160 91 V106" stroke="#64748b" stroke-width="1.5"/><path d="m155 102 5 5 5-5" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <rect x="16" y="108" width="288" height="51" rx="8" fill="#f4f7fb" stroke="#aebbc9"/>
    <text x="30" y="129" font-size="13" font-weight="700">2  检查缺失、重复、异常值</text>
    <text x="30" y="147" font-size="12" fill="#485567">先定位记录，不自动删除</text>
    <path d="M160 160 V175" stroke="#64748b" stroke-width="1.5"/><path d="m155 171 5 5 5-5" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <rect x="16" y="177" width="288" height="51" rx="8" fill="#f4f7fb" stroke="#aebbc9"/>
    <text x="30" y="198" font-size="13" font-weight="700">3  核实原始记录与编码</text>
    <text x="30" y="216" font-size="12" fill="#485567">判断是否有修正依据</text>
    <path d="M160 229 V247 M82 247 H238 M82 247 V261 M238 247 V261" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="82" y="258" text-anchor="middle" font-size="12" fill="#485567">可核实</text>
    <text x="238" y="258" text-anchor="middle" font-size="12" fill="#485567">无法核实</text>
    <rect x="16" y="266" width="140" height="103" rx="8" fill="#eaf4f0" stroke="#91b6a8"/>
    <text x="27" y="289" font-size="13" font-weight="700">依据原记录</text>
    <text x="27" y="308" font-size="13" font-weight="700">修正或保留</text>
    <text x="27" y="342" font-size="12" fill="#344e46">记录依据与改动</text>
    <rect x="164" y="266" width="140" height="103" rx="8" fill="#f4f0e8" stroke="#c5ad83"/>
    <text x="175" y="289" font-size="13" font-weight="700">标记问题</text>
    <text x="175" y="308" font-size="13" font-weight="700">按预设规则处理</text>
    <text x="175" y="342" font-size="12" fill="#62543d">记录处理决定</text>
    <path d="M82 370 V389 M238 370 V389 M82 389 H238 M160 389 V403" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <path d="m155 399 5 5 5-5" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <rect x="16" y="406" width="288" height="55" rx="8" fill="#eef2fb" stroke="#9dafd6"/>
    <text x="30" y="429" font-size="13" font-weight="700">4  输出分析数据 + 处理日志</text>
    <text x="30" y="448" font-size="12" fill="#485567">报告保留、修正及排除的规则</text>
  </g>
</svg>
