<svg xmlns="http://www.w3.org/2000/svg" width="320" height="280" viewBox="0 0 320 280" role="img" aria-labelledby="title desc">
  <title id="title">双侧 p 值的两端尾部面积</title>
  <desc id="desc">对称零假设分布的左、右尾部都被着色；两侧超过观察统计量绝对值的面积之和，是图中双侧检验的 p 值。</desc>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#111827">
    <text x="14" y="24" font-size="14" font-weight="700">双侧检验：两端都要计入</text>
    <text x="160" y="47" text-anchor="middle" font-size="12" fill="#485567">零假设 H₀ 下的对称分布</text>
    <path d="M18 184 C50 184 67 178 88 159 L88 184 Z" fill="#e6daf6"/>
    <path d="M232 159 C253 178 270 184 302 184 L232 184 Z" fill="#e6daf6"/>
    <path d="M18 184 C51 184 69 178 88 159 C111 122 132 77 160 72 C188 77 209 122 232 159 C251 178 269 184 302 184" fill="none" stroke="#6741ad" stroke-width="2.5"/>
    <path d="M18 184 H302 M88 159 V184 M160 72 V184 M232 159 V184" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="88" y="206" text-anchor="middle" font-size="12">−|tₒᵦₛ|</text>
    <text x="160" y="206" text-anchor="middle" font-size="12">0</text>
    <text x="232" y="206" text-anchor="middle" font-size="12">+|tₒᵦₛ|</text>
    <rect x="19" y="227" width="17" height="12" rx="2" fill="#e6daf6" stroke="#6741ad"/>
    <text x="44" y="239" font-size="13">左尾 + 右尾 = 此例的 p 值</text>
    <text x="19" y="261" font-size="12" fill="#485567">不是“零假设为真”的概率</text>
  </g>
</svg>
