<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">t检验设计分支</title><desc id="desc">图解为教学用途，完整说明见页面文字和图注。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="760" height="330" fill="white"/><g font-family="sans-serif"><text x="24" y="32" font-size="20" fill="#171717">先看设计，再选 t 检验</text><rect x="24" y="80" width="226" height="136" rx="12" fill="#eff4ff" stroke="#cbd5e1"/><text x="38" y="110" font-size="18" fill="#171717">独立组</text><text x="38" y="138" font-size="14" fill="#171717">不同参与者，各组自己</text><text x="38" y="160" font-size="14" fill="#171717">的样本</text><text x="38" y="190" font-size="14" fill="#2447a5">Welch：训练 − 控制</text><rect x="270" y="80" width="226" height="136" rx="12" fill="#eff4ff" stroke="#cbd5e1"/><text x="284" y="110" font-size="18" fill="#171717">同人配对</text><text x="284" y="138" font-size="14" fill="#171717">参与者 ID 对齐</text><text x="284" y="160" font-size="14" fill="#171717">保留完整配对</text><text x="284" y="190" font-size="14" fill="#2447a5">配对：后测 − 前测</text><rect x="516" y="80" width="226" height="136" rx="12" fill="#eff4ff" stroke="#cbd5e1"/><text x="530" y="110" font-size="18" fill="#171717">单样本</text><text x="530" y="138" font-size="14" fill="#171717">相对事先确定的参考值</text><text x="530" y="160" font-size="14" fill="#171717"></text><text x="530" y="190" font-size="14" fill="#2447a5">单样本：均值 − 参考值</text></g></svg>
